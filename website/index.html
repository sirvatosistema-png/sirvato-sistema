<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirvato Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Robot Left -->
            <div class="robot robot-left">
                <div class="robot-head">
                    <div class="robot-eye robot-eye-left"></div>
                    <div class="robot-eye robot-eye-right"></div>
                    <div class="robot-mouth"></div>
                </div>
                <div class="robot-body">
                    <div class="robot-arm robot-arm-left"></div>
                    <div class="robot-arm robot-arm-right"></div>
                </div>
                <div class="robot-legs">
                    <div class="robot-leg"></div>
                    <div class="robot-leg"></div>
                </div>
            </div>

            <!-- Logo Center -->
            <div class="logo-section">
                <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="90" fill="none" stroke="#000" stroke-width="3"/>
                    <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000">
                        SIRVATO
                    </text>
                    <text x="100" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
                        SISTEMA
                    </text>
                </svg>
                <h1>Sirvato Sistema</h1>
                <p>Soluzioni Innovative per il Tuo Business</p>
            </div>

            <!-- Robot Right -->
            <div class="robot robot-right">
                <div class="robot-head">
                    <div class="robot-eye robot-eye-left"></div>
                    <div class="robot-eye robot-eye-right"></div>
                    <div class="robot-mouth"></div>
                </div>
                <div class="robot-body">
                    <div class="robot-arm robot-arm-left"></div>
                    <div class="robot-arm robot-arm-right"></div>
                </div>
                <div class="robot-legs">
                    <div class="robot-leg"></div>
                    <div class="robot-leg"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
